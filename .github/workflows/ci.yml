name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-ts:
    name: expo bridge (TypeScript, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck bridge (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build config plugin (tsc --build plugin)
        run: npx tsc --build plugin --force
      - name: Lint
        run: npm run lint
      - name: Validate expo-module.config.json
        run: node -e "JSON.parse(require('fs').readFileSync('expo-module.config.json','utf8'))"

  swift-test:
    name: swift test (macOS host)
    # GitHub-hosted macOS runner (free for public repos, preinstalled Xcode).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: swift test
        run: swift test

  ios-test:
    name: xcodebuild test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Resolve an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          pick = ""
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      pick = device["udid"]
                      break
              if pick:
                  break
          print(pick)')
          if [ -z "$UDID" ]; then
            echo "No available iOS Simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Resolve package scheme
        id: scheme
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          schemes = (info.get("workspace") or info.get("project") or {}).get("schemes", [])
          print("HaviKit" if "HaviKit" in schemes else (schemes[0] if schemes else ""))')
          if [ -z "$SCHEME" ]; then echo "No scheme found" >&2; xcodebuild -list >&2; exit 1; fi
          echo "Using scheme $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult
      - name: Clean up result bundle
        if: always()
        run: rm -rf TestResults.xcresult
