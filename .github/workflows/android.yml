name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  android-build:
    name: gradle build + test + lint (Ubuntu)
    # GitHub-hosted Ubuntu runner ships the Android SDK (ANDROID_HOME set), so the
    # :havikit library module is included and compiled to an AAR here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Golden fixture is in sync across iOS and Android
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-fixture-sync.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
      - name: Core unit tests (pure JVM)
        run: ./gradlew :havikit-core:test
      - name: Android library unit tests (JVM)
        run: ./gradlew :havikit:testDebugUnitTest
      - name: Android library lint
        run: ./gradlew :havikit:lint
      - name: Assemble Android AAR
        run: ./gradlew :havikit:assemble
      - name: Assemble sample app (debug)
        run: ./gradlew :sample:assembleDebug
