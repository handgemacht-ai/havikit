apply plugin: 'com.android.library'

group = 'ai.handgemacht.expo'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// `safeExtGet` is provided by the Expo core plugin applied above.
android {
  namespace "ai.handgemacht.expo"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    // `ai.handgemacht:havikit` floors at minSdk 26; the Expo default is 24, so the
    // bridge floors here and the config plugin bumps the host app to match.
    minSdkVersion Math.max((safeExtGet("minSdkVersion", 26)) as int, 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // The wrapped native SDK: artifactId `havikit`, group `ai.handgemacht`. This
  // artifact is NOT on Maven Central and is not yet published to any public
  // repository (see README > Native dependencies); the consuming app must register
  // the hosting Maven repository — the Expo config plugin does this — before this
  // `implementation` resolves.
  implementation "ai.handgemacht:havikit:${safeExtGet('havikitSdkVersion', '0.2.0')}"
}
